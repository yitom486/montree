appId: com.montree.app
productName: Montree
publish:
  provider: github
  owner: yitom486
  repo: montree
directories:
  buildResources: apps/desktop/resources
  output: release
# 主进程仅包含运行时必需依赖（updater 与 PDF OCR 图片转换），渲染端由 Vite 打进 out/
files:
  - out/**/*
  - package.json
  # 先排除全部 node_modules，再按白名单加回主进程运行时闭包（渲染端依赖已由 Vite 打进 out/renderer，
  # 不需要再以 node_modules 形式进 asar；check:bundle 6.3 保证主进程 import 的包都在白名单里）
  - '!node_modules/**'
  - apps/desktop/src/components/agent/LICENSE.beautiful-ui
  - apps/desktop/src/components/agent/LICENSE.beui
  - apps/desktop/resources/LICENSE.react-artifact.txt
  - apps/desktop/resources/LICENSE.diagram-design.txt
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/node-pty/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/argparse/**/*
  - node_modules/sax/**/*
  - node_modules/pdfjs-dist/**/*
  # 仅排除调试映射；legacy 主进程解析、字体与 worker 仍保留。
  - '!node_modules/pdfjs-dist/**/*.map'
  # pdf-inspector Node 绑定（主进程分类/抽取/OCR）与其平台二进制包
  - node_modules/@firecrawl/pdf-inspector/**/*
  - node_modules/@firecrawl/pdf-inspector-*/**/*
  # ACP 客户端与官方 SDK（主进程 external 运行时依赖）与其 peer zod
  - node_modules/@yitom/acp-client/**/*
  - node_modules/@agentclientprotocol/sdk/**/*
  - node_modules/zod/**/*
  # 行内补全：Vercel AI SDK（主进程 external）及其运行时依赖闭包
  - node_modules/ai/**/*
  - node_modules/@ai-sdk/gateway/**/*
  - node_modules/@ai-sdk/provider/**/*
  - node_modules/@ai-sdk/provider-utils/**/*
  - node_modules/@ai-sdk/openai-compatible/**/*
  - node_modules/json-schema/**/*
  - node_modules/@standard-schema/spec/**/*
  - node_modules/@workflow/serde/**/*
  - node_modules/eventsource-parser/**/*
  - node_modules/undici/**/*
  - node_modules/@vercel/oidc/**/*
  # 聊天/阅读器 npm 包中主进程实际 import 的运行时依赖（renderer 侧由 vite 打进包，无需收录）
  - node_modules/@yitom/annotations/**/*
  - node_modules/@yitom/reader-core/**/*
  - node_modules/@google/genai/**/*
  - node_modules/gemini-tts-studio/**/*
  - node_modules/microsoft-cognitiveservices-speech-sdk/**/*
  # 上述包的传递依赖闭包（check:bundle 6.4 自动核对，缺一项即失败）
  - node_modules/@azure/abort-controller/**/*
  - node_modules/@azure/core-auth/**/*
  - node_modules/@azure/core-util/**/*
  - node_modules/@protobufjs/aspromise/**/*
  - node_modules/@protobufjs/base64/**/*
  - node_modules/@protobufjs/codegen/**/*
  - node_modules/@protobufjs/eventemitter/**/*
  - node_modules/@protobufjs/fetch/**/*
  - node_modules/@protobufjs/float/**/*
  - node_modules/@protobufjs/path/**/*
  - node_modules/@protobufjs/pool/**/*
  - node_modules/@protobufjs/utf8/**/*
  - node_modules/@types/retry/**/*
  - node_modules/@types/webrtc/**/*
  - node_modules/@typespec/ts-http-runtime/**/*
  - node_modules/@yitom/contracts/**/*
  - node_modules/agent-base/**/*
  - node_modules/base64-js/**/*
  - node_modules/bent/**/*
  - node_modules/bignumber.js/**/*
  - node_modules/buffer-equal-constant-time/**/*
  - node_modules/bytesish/**/*
  - node_modules/caseless/**/*
  - node_modules/clsx/**/*
  - node_modules/data-uri-to-buffer/**/*
  - node_modules/debug/**/*
  - node_modules/ecdsa-sig-formatter/**/*
  - node_modules/extend/**/*
  - node_modules/fetch-blob/**/*
  - node_modules/formdata-polyfill/**/*
  - node_modules/gaxios/**/*
  - node_modules/gcp-metadata/**/*
  - node_modules/google-auth-library/**/*
  - node_modules/google-logging-utils/**/*
  - node_modules/hono/**/*
  - node_modules/http-proxy-agent/**/*
  - node_modules/https-proxy-agent/**/*
  - node_modules/is-stream/**/*
  - node_modules/json-bigint/**/*
  - node_modules/jwa/**/*
  - node_modules/jws/**/*
  - node_modules/long/**/*
  - node_modules/ms/**/*
  - node_modules/node-addon-api/**/*
  - node_modules/node-domexception/**/*
  - node_modules/node-fetch/**/*
  - node_modules/p-retry/**/*
  - node_modules/protobufjs/**/*
  - node_modules/retry/**/*
  - node_modules/safe-buffer/**/*
  - node_modules/tailwind-merge/**/*
  - node_modules/tslib/**/*
  - node_modules/web-streams-polyfill/**/*
  - node_modules/ws/**/*
  # 体积：原生包只留运行所需。调试符号、源码与构建脚本不进安装包；其他平台的预编译产物按平台在下方剔除
  - '!node_modules/node-pty/{deps,src,third_party,scripts,typings,binding.gyp}{,/**}'
  - '!node_modules/node-pty/**/*.pdb'
  - '!node_modules/node-pty/build/{Makefile,*.mk,config.gypi,obj.target,node-addon-api}{,/**}'
  - '!node_modules/node-pty/build/Release/{obj.target,.deps}{,/**}'
  # pdfjs：主进程只用 legacy 构建（+ 字体/CMap/wasm），渲染端由 Vite 打包
  - '!node_modules/pdfjs-dist/{build,web,types,image_decoders}{,/**}'
  # musl 构建只给 Alpine 用，桌面发行版不需要
  - '!node_modules/@firecrawl/pdf-inspector-linux-x64-musl{,/**}'
  - '!node_modules/{@codemirror,codemirror,codemirror-lang-typst,@tanstack,@vscode,dompurify,highlight.js,katex,markdown-it,markdown-it-task-lists,mermaid,next-themes,radix-ui,react,react-dom,react-resizable-panels,sonner,zustand,d3,d3-*,cytoscape*,dagre*,cose-base,layout-base,khroma,stylus,pug,coffeescript}/**'
electronLanguages:
  - zh-CN
  - en-US
asarUnpack:
  - node_modules/node-pty/**/*
# 远端工作区 Node 服务：自包含 bundle + manifest（`bun run build:remote-server` 产物），
# main 在 resourcesPath/remote-server（开发期为本目录）定位并校验后启动
beforePack: ./scripts/verify-typst-before-pack.cjs
extraResources:
  # Tinymist（约 74 MB）不再随包：首次使用 Typst 时按固定版本下载并校验 SHA-256（见 services/typst/tinymist-download.ts），
  # 安装包只带许可证
  - from: apps/desktop/resources/typst
    to: typst
    filter:
      - LICENSE
  - from: apps/desktop/resources/remote-server
    to: remote-server
  # 应用级原生规则与隔离 Skills 默认资源（主进程 resourcesPath/agent，开发期为本目录）
  - from: apps/desktop/resources/agent
    to: agent

win:
  icon: apps/desktop/resources/icon.ico
  # 平台级 files 必须带至少一个正向模式，否则 electron-builder 会补默认的 **/*（把整个仓库打进 asar）
  files:
    - package.json
    - '!node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}{,/**}'
    - '!node_modules/@firecrawl/pdf-inspector-{darwin,linux}-*{,/**}'
  target:
    - nsis

# 默认 oneClick 会一键装进 %LOCALAPPDATA%，没有选目录页
nsis:
  # 产物名禁空格：electron-builder 写 latest.yml 时把空格转连字符，
  # 而 GitHub Release 资产名把空格转点，两边对不上导致自动更新 404。
  # 此处直接用连字符命名，三处（构建产物/latest.yml/Release 资产）永远一致。
  artifactName: ${productName}-Setup-${version}.${ext}
  include: apps/desktop/resources/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 默认按当前用户安装（不强制管理员）；选 Program Files 等系统目录时仍会提权
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Montree
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  # 卸载时保留阅读进度 / 书签，避免误清用户数据
  deleteAppDataOnUninstall: false

mac:
  icon: apps/desktop/resources/icon.png
  # 平台级 files 必须带至少一个正向模式，否则 electron-builder 会补默认的 **/*（把整个仓库打进 asar）
  files:
    - package.json
    - '!node_modules/node-pty/prebuilds/{win32-*,darwin-x64}{,/**}'
    - '!node_modules/@firecrawl/pdf-inspector-{win32,linux}-*{,/**}'
  category: public.app-category.productivity
  # 无 Apple 开发者证书时跳过公证；用户需在「隐私与安全性」中允许打开
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    # 仅 Apple Silicon：上游 Rust 解析器（pdf-inspector）无 mac x64 预编译，
    # 且 Intel Mac 已无实测环境；如需恢复 x64，加回 arch 并验证 OCR/WASM 链路
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

linux:
  icon: apps/desktop/resources/icon.png
  # 平台级 files 必须带至少一个正向模式，否则 electron-builder 会补默认的 **/*（把整个仓库打进 asar）
  files:
    - package.json
    - '!node_modules/node-pty/prebuilds{,/**}'
    - '!node_modules/@firecrawl/pdf-inspector-{win32,darwin}-*{,/**}'
  category: Office
  maintainer: yitom486 <yitom486@gmail.com>
  desktop:
    entry:
      Name: Montree
      Comment: Markdown 编辑与电子书 / 在线文档阅读
      Categories: Office;TextEditor;
      Terminal: false
      Type: Application
  target:
    - AppImage
    - deb
# AppImage 用 squashfs：默认 gzip 改为 xz（体积更小，启动解压略慢但可接受）；deb 用 xz
appImage:
  # electron-builder 26 起支持；旧版本忽略该键
  compression: xz
deb:
  compression: xz
