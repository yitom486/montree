name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Release 工作流复用本文件：发版前必须先跑完整 CI（含 E2E），红了就不打包不发布
  workflow_call:
    inputs:
      ref:
        description: 要检出的 git ref（tag 或提交）；留空则用触发事件的 ref
        required: false
        type: string
        default: ''

jobs:
  quality:
    name: 类型检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: 安装 Node（版本见 .node-version）
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: 文档清单检查
        run: bun run lint:docs

      - name: 依赖边界检查
        run: bun run lint:deps

      - name: 单元与集成测试
        run: bun run test

  e2e:
    name: Electron E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: 安装 Node（版本见 .node-version）
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建应用
        run: bun run build:remote-server && bun run build

      - name: 准备 Typst 运行时
        run: bun run prepare:typst

      - name: 安装 Typst 中文验证字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Typst 真实编译集成测试
        run: bunx vitest run apps/desktop/electron/services/typst/typst-live.test.ts

      - name: 体积与打包清单检查
        run: bun run check:bundle
        env:
          MONTREE_REQUIRE_TYPST: '1'

      - name: 安装 Playwright 系统依赖
        run: bunx playwright install-deps

      - name: 安装虚拟显示（Electron 在 Linux CI 需要 X11）
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: E2E 测试
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" bun run test:e2e
        env:
          CI: true

  e2e-windows:
    name: Windows E2E (${{ matrix.scale }}x)
    runs-on: windows-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # 1x 常规；1.5x 模拟 150% 缩放（高 DPI 布局/宽度抖动回归）
        scale: ['1', '1.5']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: 安装 Node（版本见 .node-version）
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建应用
        run: bun run build:remote-server && bun run build

      - name: 准备 Typst 运行时
        run: bun run prepare:typst

      - name: E2E 测试（Windows 关键路径）
        shell: bash
        run: >-
          bun run test:e2e
          apps/desktop/e2e/app-smoke.spec.ts
          apps/desktop/e2e/workspace-render-isolation.spec.ts
          apps/desktop/e2e/annotations-react-docs.spec.ts
          apps/desktop/e2e/typst-editor.spec.ts
          apps/desktop/e2e/terminal.spec.ts
          apps/desktop/e2e/ai-edit-review-tools.spec.ts
          apps/desktop/e2e/chat-links.spec.ts
          apps/desktop/e2e/agent-terminal-approval.spec.ts
          apps/desktop/e2e/window-width-stability.spec.ts
        env:
          CI: true
          E2E_DEVICE_SCALE_FACTOR: ${{ matrix.scale }}
          ROUND4_SCREENSHOT_DIR: ${{ github.workspace }}/e2e-shots

      - name: 打包 NSIS 安装包并报告体积（1x）
        if: matrix.scale == '1'
        shell: bash
        run: |
          bunx electron-builder --config apps/desktop/electron-builder.yml --win --publish never
          ls -l release/*.exe
          echo "### Windows 安装包体积" >> "$GITHUB_STEP_SUMMARY"
          for f in release/*.exe; do echo "- $(basename "$f"): $(( $(stat -c%s "$f") / 1048576 )) MiB" >> "$GITHUB_STEP_SUMMARY"; done

      - name: 打包版冒烟（安装目录产物，1x）
        if: matrix.scale == '1'
        shell: bash
        run: >-
          bun run test:e2e
          apps/desktop/e2e/app-smoke.spec.ts
          apps/desktop/e2e/terminal.spec.ts
          apps/desktop/e2e/typst-runtime-download.spec.ts
          apps/desktop/e2e/reader-pdf-ocr.spec.ts
        env:
          CI: true
          E2E_PACKAGED_EXE: release/win-unpacked/Montree.exe

      - name: 上传失败产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-${{ matrix.scale }}x
          path: |
            test-results
            e2e-shots
          if-no-files-found: ignore
